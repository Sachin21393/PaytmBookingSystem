services:
  - type: web
    name: paytm-booking-service
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DB_URL
        fromDatabase:
          name: paytmdb
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: paytmdb
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: paytmdb
          property: password
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: paytmdb
    databaseName: paytmdb
    user: postgres
    plan: free

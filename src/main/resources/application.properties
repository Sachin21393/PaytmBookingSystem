spring.application.name=paytmProject
server.port=8080
server.shutdown=graceful
app.security.enabled=true

# JWT Configuration (Uses ENV variable JWT_SECRET if present, with local fallback)
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-seconds=86400
app.jwt.issuer=paytmProject

# PostgreSQL Database Configuration (Uses ENV variables with local dev fallbacks)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/paytmdb}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# HikariCP Connection Pool Configuration
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Hibernate DDL Auto - Automatically creates and updates schema in PostgreSQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Actuator & Observability
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.endpoint.health.group.readiness.include=readinessState,db
management.health.db.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.observations.http.server.requests.name=http.server.requests
management.prometheus.metrics.export.enabled=true

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://postgres:5432/seat_reservation}
spring.datasource.username=${DATABASE_USERNAME:seat_reservation}
spring.datasource.password=${DATABASE_PASSWORD:seat_reservation}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.h2.console.enabled=false
app.security.enabled=true
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OAUTH2_JWK_SET_URI}

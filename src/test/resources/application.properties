spring.application.name=paytmProject
app.security.enabled=true

# JWT Configuration
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-seconds=86400
app.jwt.issuer=paytmProject

# Test In-Memory Database (Hibernate creates schema from entities)
spring.datasource.url=jdbc:h2:mem:paytmtestdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# Actuator & Probes Configuration for Tests
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.endpoint.health.group.readiness.include=readinessState,db
management.health.db.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.observations.http.server.requests.name=http.server.requests
management.prometheus.metrics.export.enabled=true
